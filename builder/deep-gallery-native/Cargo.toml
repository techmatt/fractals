[package]
name = "deep-gallery-native"
version = "0.1.0"
edition = "2024"
publish = false

# The Deep tab's kernel, natively: `explorer/perturb-wasm` as an rlib, so the gallery's
# fields are the arithmetic `perturb.wasm` does, on every core. That crate wraps
# `fractal-wallpapers/perturbation`, the picture kernel, and adds the minibrot search and
# the Dive this binary also drives, so the sibling checkout has to be there to build it.
# Nothing in either crate is built differently for it, and their `Cargo.lock`s are not
# read.
[dependencies]
perturb = { path = "../../explorer/perturb-wasm" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
