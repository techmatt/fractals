# There is no package here. This file exists so the page builder in `builder/` is
# governed by the same formatter and lint rules as the code repository from the
# first line it is written, rather than acquiring them after it has a shape.

[tool.ruff]
line-length = 100
src = ["builder"]
# The builder reads TOML with `tomllib` and is run on a workstation, never in CI's
# deploy path; saying so is what lets the linter sort a standard-library import.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
