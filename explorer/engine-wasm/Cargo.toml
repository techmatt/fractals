[package]
name = "explorer-engine-wasm"
version = "0.1.0"
edition = "2024"
publish = false

# The site's copy of the renderer, as a raw wasm module. Two exports carry the
# whole page — one computes a band of the field, one shades an assembled field —
# because that seam is what makes a palette change instant.
[lib]
crate-type = ["cdylib"]

[features]
# The paged Inflection tab's seam, and **off in the shipped build**. The tab is out of the
# explorer's working set (`explorer/paged-inflection/README.md`); with this off, `inflect.rs`
# is not compiled, `Spec` has no `inflections` key and `deny_unknown_fields` refuses one, and
# the module carries no pre-map. `--features inflection` is the whole of putting it back.
#
# A cargo feature rather than the bare `--cfg` `build.rs` uses for `generic_loop`, because
# this one is a shipped/not-shipped switch rather than a bench knob, and the default build
# has to be the one nobody has to remember a flag for. Renders were measured identical
# across the bench ladder with it off.
inflection = []

[dependencies]
# A path dependency on the sibling checkout, and deliberately not a git one: the
# engine crate is versioned `0.1.0` and never bumped, so a git dependency could
# not tell two revisions apart, and it would drag the whole wallpaper project —
# Python, data, labels — into a build that wants one Rust library. `build.rs`
# says so plainly when the sibling is not there.
fractal-engine = { path = "../../../fractal-wallpapers/engine" }
num-complex = "0.4"
# The spec crosses the boundary as JSON so that a family, a mode, a mode parameter
# and a palette recipe have one spelling here and one over there: the engine's own.
# Neither of these is a new dependency of anything — the engine already carries
# both, and this crate is the only thing built from that tree.
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`, because the default parser is fast rather than exact and reads a
# 17-digit decimal one unit of last place away about one time in ten. A tone curve
# crosses this boundary as five such decimals, and a curve one ulp off is not the
# curve the link carries — measured on the backfill sidecar, 424 of 4,411 stored
# curves failed to re-derive for exactly this reason and 0 once it was on.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Release only; the module is a committed artifact and there is no debug build of
# it. LTO is what dead-strips png, jpeg-encoder and flate2 out of the module.
# `strip = "symbols"` drops the 48 KB `name` section, which only a debugger reads
# (explorer_slim_ckpt131). `opt-level` stays at 3: `s` and `z` draw the same pixels
# and were measured 57% and 79% slower on the anchor render.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
