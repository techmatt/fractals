[package]
name = "perturb"
version = "0.1.0"
edition = "2024"
publish = false

# The Deep tab's kernel, as a raw wasm module of its own. Separate from
# `engine-wasm` on purpose: the shallow path — `engine.wasm`, every shallow
# picture, every shallow key — cannot be slowed or changed by anything in here,
# because none of it is linked into that module. The two meet on the page, at a
# buffer of `f64` lanes.
[lib]
crate-type = ["cdylib", "rlib"]

# **One dependency: the picture kernel, from the sibling checkout.** The fixed-point
# reals, the reference orbit, the delta loop, the cap and the spec are
# `fractal-wallpapers/perturbation`, which `fractal-engine render-link` draws deep links
# from natively, so the page and the CLI draw from one copy. A path dependency and not a
# git one, as `engine-wasm` takes the engine, and pinned the same way: by
# `engine.manifest.json`'s one `wallpapers_commit`. Without the sibling, cargo stops with
# "failed to read `…/fractal-wallpapers/perturbation/Cargo.toml`", a path that names the
# missing checkout. What stays here is what only the explorer asks for: the
# minibrot search, the Dive and the exports.
[dependencies]
perturbation = { path = "../../../fractal-wallpapers/perturbation" }

# The same profile as `engine-wasm`, for the same reasons, measured there: `s` and
# `z` draw the same pixels and were 57% and 79% slower.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
