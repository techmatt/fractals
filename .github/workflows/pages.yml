# Publishes the repository as-is to GitHub Pages on every push to main.
#
# There is no build step and there is not going to be one: `builder/` generates
# pages here, on a workstation, and its output is committed. This workflow exists
# instead of the "deploy from a branch" setting because that setting runs the site
# through Jekyll, which would start interpreting files this site does not intend as
# templates. What is committed is what is served.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
