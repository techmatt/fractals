# Publishes the repository as-is to GitHub Pages on every push to main.
#
# There is no build step and there is not going to be one: `builder/` generates
# pages here, on a workstation, and its output is committed. This workflow exists
# instead of the "deploy from a branch" setting because that setting runs the site
# through Jekyll, which would start interpreting files this site does not intend as
# templates. What is committed is what is served.
#
# Upload and deploy are two jobs, not two steps of one. deploy-pages finds the
# artifact by listing the run's artifacts by name, and that listing can trail the
# upload's finalize: run 45281082696 (Nov 23 2026) listed 0 artifacts 0.2 s after a
# finalized upload and failed, where the same tree deployed on a fresh run. The job
# boundary puts seconds between the two; it narrows the race, it does not close it.
# If it recurs, use "Re-run failed jobs", which re-runs `deploy` against the one
# artifact already uploaded. "Re-run all jobs" uploads a second `github-pages` and
# deploy refuses the pair. upload-pages-artifact v4+ leaves dotfiles out; the only
# tracked ones are `.gitattributes` and `.gitignore`, which the site does not need.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
