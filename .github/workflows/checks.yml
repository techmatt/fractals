# Checks the committed tree. Deliberately not a dependency of `pages.yml`: the site is
# served from the commit, so a red check here means the next commit needs work, never
# that the live site is down.
#
# `python -m builder check` regenerates every page the builder owns from today's metadata
# and compares it byte for byte with what is committed — the sync check that keeps
# "committed output" from quietly meaning "output from some earlier version of the
# builder". It writes nothing.
#
# This job is a bare clone: the wallpaper project is not here and never will be, and
# `FRACTAL_WALLPAPERS_ROOT` is set empty to say so rather than leave it to the absence of
# an untracked `local.toml`. Every check runs anyway; the four that want that checkout —
# `library`, `bake`, `seats`, and the source-key half of `figures` — report a named skip. A red on this step therefore means a check failed. It has meant
# something else once: `check` built the palette library page straight off the checkout,
# so this step raised before the first check and stayed red for a reason that was about
# this runner and not about the site.
#
# The node steps run the explorer's own tests with node's own test runner — the permalink
# contract, and the pool's claim that a band is a range of output rows however many
# workers cut the frame. Nothing is installed for either: there is no package.json here
# and there is not going to be one. The second one instantiates the committed wasm and
# draws the anchor at 320x180 four times over, which is a few seconds.

name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r builder/requirements.txt
      - name: ruff lint
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: links, page sync, figure blocks, image assets
        env:
          # Empty is a statement: this machine has no wallpapers checkout. See above.
          FRACTAL_WALLPAPERS_ROOT: ""
        run: python -m builder check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: the explorer's permalink contract
        run: node --test explorer/permalink.test.mjs
      - name: the pool's bands, against the committed module
        run: node --test explorer/bands.test.mjs
      - name: the tone operator's measure half, against the committed module
        run: node --test explorer/level.test.mjs
      - name: a mode's derived parameters, against the committed module
        run: node --test explorer/derive.test.mjs
      - name: the atlas record, and the map its dots are drawn through
        run: node --test atlas/atlas.test.mjs
      - name: the palette blob's reader, against the layout the bake writes
        run: node --test explorer/stops.test.mjs
      - name: the Saved tab's list, and the zip Download all writes
        run: node --test explorer/saved.test.mjs explorer/zip.test.mjs
